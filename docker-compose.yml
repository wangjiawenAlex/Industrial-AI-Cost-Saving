version: '3.8'

services:
  # FastAPI 后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sap-query-backend
    ports:
      - "8000:8000"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DATABASE_URL=sqlite:///./sap_query_demo.db
      - FASTAPI_HOST=0.0.0.0
      - FASTAPI_PORT=8000
    volumes:
      - ./:/app
    command: python backend.py
    networks:
      - sap-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Streamlit 前端应用
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sap-query-frontend
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    volumes:
      - ./:/app
    command: streamlit run frontend.py
    networks:
      - sap-network
    depends_on:
      backend:
        condition: service_healthy

networks:
  sap-network:
    driver: bridge
